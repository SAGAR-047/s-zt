services:
  # ── Infrastructure ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    environment:
      CLICKHOUSE_DB: sentinel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Medical Services ──
  vitals:
    build: ./services/medical/vitals
    environment:
      PORT: 5000
      VITALS_DEPENDS_ON: ""
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  drug-dispenser:
    build: ./services/medical/drug-dispenser
    environment:
      PORT: 5001
      DRUG_DISPENSER_DEPENDS_ON: "http://vitals:5000"
    ports:
      - "5001:5001"
    depends_on:
      - vitals
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ehr:
    build: ./services/medical/ehr
    environment:
      PORT: 5002
      EHR_DEPENDS_ON: ""
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing:
    build: ./services/medical/billing
    environment:
      PORT: 5003
      BILLING_DEPENDS_ON: "http://ehr:5002"
    ports:
      - "5003:5003"
    depends_on:
      - ehr
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Intelligence Services ──
  streaming-anomaly-detector:
    build: ./services/intelligence/streaming-anomaly-detector
    environment:
      PORT: 8080
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_ENABLED: "false"   # Disable Kafka consumer; we'll use REST only
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: sentinel
      IFOREST_THRESHOLD: "0.75"
      HMM_THRESHOLD: "-5.0"
      MODEL_SAVE_PATH: /data/models
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - clickhouse
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - anomaly_models:/data/models

  diagnosis-service:
    build: ./services/intelligence/diagnosis-service
    environment:
      PORT: 8081
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: sentinel
      ENABLE_IN_MEMORY_FALLBACK: "true"
      LOOKBACK_SECONDS: "60"
    ports:
      - "8081:8081"
    depends_on:
      - clickhouse
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mape-k-controller:
    build: ./services/orchestrator/mape-k-controller
    environment:
      OVERRIDE_PORT: 8083
      DIAGNOSIS_SERVICE_URL: http://diagnosis-service:8081
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: sentinel
      SAFETY_TIMEOUT_SECONDS: "3"
    ports:
      - "8083:8083"
    depends_on:
      - diagnosis-service
      - clickhouse
    # The controller runs Kopf which expects Kubernetes; in lab mode we run the Flask override API.
    command: ["python", "-c", "from controller import run_override_api; run_override_api()"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SentinelCloud Backend ──
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SENTINEL_MODE: lab
      SENTINEL_HOST: 0.0.0.0
      SENTINEL_PORT: 5050
      SENTINEL_SECRET_KEY: "dev-secret-key-change-in-production"
      SENTINEL_ADMIN_USER: admin
      SENTINEL_ADMIN_PASSWORD: sentinel-admin-2026
      SENTINEL_CORS_ORIGINS: http://localhost:3000,http://localhost:5050
      SENTINEL_KAFKA_ENABLED: "true"
      SENTINEL_KAFKA_BOOTSTRAP: kafka:9092
      SENTINEL_CLICKHOUSE_ENABLED: "true"
      SENTINEL_CLICKHOUSE_HOST: clickhouse
      SENTINEL_CLICKHOUSE_PORT: 9000
      SENTINEL_CLICKHOUSE_DB: sentinel
      SENTINEL_KUBERNETES_ENABLED: "false"
      SENTINEL_VITALS_URL: http://vitals:5000
      SENTINEL_DRUG_DISPENSER_URL: http://drug-dispenser:5001
      SENTINEL_EHR_URL: http://ehr:5002
      SENTINEL_BILLING_URL: http://billing:5003
      SENTINEL_ANOMALY_DETECTOR_URL: http://streaming-anomaly-detector:8080
      SENTINEL_DIAGNOSIS_SERVICE_URL: http://diagnosis-service:8081
      SENTINEL_DETECTOR_ENABLED: "true"
      SENTINEL_MAPE_K_CONTROLLER_URL: http://mape-k-controller:8083
      SENTINEL_MAPE_K_ENABLED: "false"   # We'll use internal MAPE-K in lab mode for simplicity
      SENTINEL_SQLITE_PATH: /data/sentinel.db
    ports:
      - "5050:5050"
    depends_on:
      - kafka
      - clickhouse
      - vitals
      - drug-dispenser
      - ehr
      - billing
      - streaming-anomaly-detector
      - diagnosis-service
    volumes:
      - backend_data:/data
      - ./backend:/app/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (optional) ──
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.frontend
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:5050
  #     NEXT_PUBLIC_SOCKET_URL: http://localhost:5050
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend

volumes:
  anomaly_models:
  backend_data:
