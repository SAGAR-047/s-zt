# SecurityAlert CRD – installed by the Helm chart
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: securityalerts.sentinel.io
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  group: sentinel.io
  names:
    kind: SecurityAlert
    listKind: SecurityAlertList
    plural: securityalerts
    singular: securityalert
    shortNames: [salert, sa]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [podName, namespace, anomalyScore]
              properties:
                podName:
                  type: string
                namespace:
                  type: string
                anomalyScore:
                  type: number
                  format: double
                explanation:
                  type: string
                source:
                  type: string
                  enum: [iforest, hmm, "iforest+hmm", falco, dns, manual]
                timestamp:
                  type: string
                  format: date-time
            status:
              type: object
              properties:
                phase:
                  type: string
                action:
                  type: string
                rootCause:
                  type: string
                remediatedAt:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Pod
          type: string
          jsonPath: .spec.podName
        - name: Score
          type: number
          jsonPath: .spec.anomalyScore
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Action
          type: string
          jsonPath: .status.action
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
