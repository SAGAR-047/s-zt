apiVersion: v2
name: sentinel-chart
description: SentinelCloud-Advanced – eBPF-Driven Autonomous Cyber-Resilience for Medical Microservices
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - ebpf
  - security
  - kubernetes
  - medical
  - microservices
  - anomaly-detection

maintainers:
  - name: SentinelCloud Team

dependencies:
  - name: cilium
    version: "1.15.*"
    repository: "https://helm.cilium.io/"
    condition: cilium.enabled
  - name: tetragon
    version: "1.0.*"
    repository: "https://helm.cilium.io/"
    condition: tetragon.enabled
  - name: falco
    version: "4.0.*"
    repository: "https://falcosecurity.github.io/charts"
    condition: falco.enabled
  - name: gatekeeper
    version: "3.15.*"
    repository: "https://open-policy-agent.github.io/gatekeeper/charts"
    condition: gatekeeper.enabled
