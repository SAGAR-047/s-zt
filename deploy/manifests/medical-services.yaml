# Kubernetes Deployments & Services for Medical Microservices
# Namespace: medical

---
apiVersion: v1
kind: Namespace
metadata:
  name: medical
  labels:
    sentinel.io/monitored: "true"

---
# ==================== VITALS ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitals
  namespace: medical
  labels:
    app: vitals
    critical: "true"
    tier: medical
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vitals
  template:
    metadata:
      labels:
        app: vitals
        critical: "true"
        tier: medical
    spec:
      containers:
        - name: vitals
          image: sentinelcloud/vitals:latest
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vitals
  namespace: medical
  labels:
    app: vitals
spec:
  type: ClusterIP
  selector:
    app: vitals
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http

