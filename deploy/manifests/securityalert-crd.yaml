apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: securityalerts.sentinel.io
spec:
  group: sentinel.io
  names:
    kind: SecurityAlert
    listKind: SecurityAlertList
    plural: securityalerts
    singular: securityalert
    shortNames:
      - salert
      - sa
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - podName
                - namespace
                - anomalyScore
              properties:
                podName:
                  type: string
                  description: "Name of the suspect pod"
                namespace:
                  type: string
                  description: "Namespace of the suspect pod"
                anomalyScore:
                  type: number
                  format: double
                  minimum: 0
                  maximum: 1
                  description: "Anomaly score from the detection engine (0-1)"
                explanation:
                  type: string
                  description: "ExIFFI feature contribution explanation"
                source:
                  type: string
                  enum: ["iforest", "hmm", "iforest+hmm", "falco", "dns", "manual"]
                  description: "Detection source"
                timestamp:
                  type: string
                  format: date-time
                  description: "When the anomaly was detected"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["pending", "analysing", "remediating", "remediated", "failed", "overridden"]
                action:
                  type: string
                  description: "Remediation action taken"
                rootCause:
                  type: string
                  description: "Diagnosed root cause"
                remediatedAt:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Pod
          type: string
          jsonPath: .spec.podName
        - name: Score
          type: number
          jsonPath: .spec.anomalyScore
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Action
          type: string
          jsonPath: .status.action
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
